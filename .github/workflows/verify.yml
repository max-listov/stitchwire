name: Optional hosted verification
# Run by hand only. Release certification runs on owned machines; a hosted run adds the OS and
# Node matrix no single local run covers, and its quota or billing is never a release prerequisite.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22', '26.13.1']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      # The macOS icon build needs rsvg-convert, which the hosted macOS images do not include.
      - if: runner.os == 'macOS'
        run: brew install librsvg
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run verify
      - name: Verify publication source selection
        run: |
          bun scripts/public-source.ts --out "$RUNNER_TEMP/wire-source"
          bun scripts/public-source.ts --verify "$RUNNER_TEMP/wire-source"
# No publication, deployment, credentials or private companion dependency.
