name: Publish verified npm archives
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    environment: npm-production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Download sealed release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/release"
      - name: Publish both verified archives with provenance
        run: bun scripts/npm-release.ts "$RUNNER_TEMP/release" --publish
