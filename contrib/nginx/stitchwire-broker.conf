# The public edge for a broker. The broker itself binds 127.0.0.1 and speaks Socket.IO, so this
# vhost has exactly two jobs: terminate TLS, and keep a connection alive that is meant to last weeks.
#
# The timeouts are not decoration. With nginx defaults a node's connection is closed after 60 idle
# seconds, and the symptom is a fleet that "randomly" loses machines overnight.

server {
    listen 443 ssl;
    http2 on;
    server_name wire.example.com;

    ssl_certificate     /etc/letsencrypt/live/wire.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wire.example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8790;

        # Socket.IO upgrades to a WebSocket; without these two the handshake silently falls back to
        # polling, and every long call pays for it.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A node holds one connection for weeks and a call may legitimately run for minutes.
        proxy_read_timeout  7d;
        proxy_send_timeout  7d;
        proxy_buffering     off;

        # A captured answer is capped at 4 MiB by the protocol, and one frame at 12 MiB.
        client_max_body_size 12m;
    }
}
